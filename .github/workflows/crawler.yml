name: Run Crawler Daily

on:
  schedule:
    # Chạy lúc 22:00 UTC mỗi ngày (tương đương 5:00 AM giờ Việt Nam UTC+7)
    - cron: '0 22 * * *'
  # Cho phép bấm nút "Run workflow" thủ công trên GitHub để test ngay
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run main.py
      env:
        # Khai báo các biến từ GitHub Secrets (thay tên biến theo đúng file .env của bạn)
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py